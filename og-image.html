<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoorCompass — social card source</title>
<style>
    html, body { margin: 0; padding: 0; }
    body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: #0d1532;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .glow-a { position: absolute; top: -260px; right: -170px; width: 720px; height: 720px; background: radial-gradient(circle, rgba(99, 119, 255, .30), transparent 62%); }
    .glow-b { position: absolute; bottom: -260px; left: -170px; width: 640px; height: 640px; background: radial-gradient(circle, rgba(77, 154, 125, .22), transparent 62%); }
    .wrap { position: absolute; inset: 0; padding: 0 90px; display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { margin: 0 0 20px; color: #aebcff; font-size: 22px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 24px; color: #ffffff; font-size: 84px; font-weight: 800; letter-spacing: -.05em; line-height: 1.04; }
    .tag { margin: 0; color: #bdc6df; font-size: 29px; font-weight: 600; }
    .icons { position: absolute; right: 90px; bottom: 78px; display: flex; gap: 22px; }
    .icons img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 16px 34px rgba(0, 0, 0, .38); object-fit: cover; }
    .url { position: absolute; left: 90px; bottom: 88px; color: #8f9ab8; font-size: 22px; font-weight: 700; }
</style>
</head>
<body>
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div class="wrap">
        <p class="eyebrow">Apps by NoorCompass</p>
        <h1>Learn something.<br>Play something.</h1>
        <p class="tag">Whirldrop &middot; DuaLearn &middot; StrayFinder</p>
    </div>
    <div class="icons">
        <img src="whirldrop-icon.png" alt="Whirldrop">
        <img src="app_icon.png" alt="DuaLearn">
        <img src="strayfinder-icon.png" alt="StrayFinder">
    </div>
    <div class="url">noorcompass.com</div>
</body>
</html>
